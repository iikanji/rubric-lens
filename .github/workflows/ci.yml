name: Rubric Lens verification

on:
  push:
    branches:
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Build Cloud Functions
        run: npm --prefix functions run build
      - name: Allocation tests
        run: npm --prefix functions test
      - name: Firestore security rules tests
        run: npm run test:rules
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-rubric-lens.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-rubric-lens
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abc123"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
